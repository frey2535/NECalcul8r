<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="application-name" content="NECalcul8r" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NECalcul8r" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="NECalcul8r — NEC electrical code calculators for phones, tablets, and the shop. Save jobs by project." />
    <title>NECalcul8r — NEC Electrical Code Calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var redirect = sessionStorage.getItem("necalcul8r_redirect");
        if (!redirect) return;
        sessionStorage.removeItem("necalcul8r_redirect");
        if (redirect !== window.location.pathname + window.location.search + window.location.hash) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
