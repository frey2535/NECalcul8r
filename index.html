<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="application-name" content="NECalcul8r" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NECalcul8r" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="NECalcul8r — NEC electrical code calculators for phones, tablets, and the shop. Save jobs by project." />
    <title>NECalcul8r — NEC Electrical Code Calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var redirect = sessionStorage.getItem("necalcul8r_redirect");
        if (redirect) {
          sessionStorage.removeItem("necalcul8r_redirect");
          if (redirect !== window.location.pathname + window.location.search + window.location.hash) {
            history.replaceState(null, "", redirect);
          }
        }

        // Boot-time update check for installed PWAs. Runs before React so a stale
        // home-screen shell can still detect a newer GitHub Pages deploy.
        var currentSha = "%NECALCUL8R_BUILD_SHA%";
        window.__NECALCUL8R_BUILD_SHA__ = currentSha;
        if (!currentSha || currentSha === "local" || currentSha.indexOf("%NECALCUL8R") === 0) return;
        var reloadKey = "necalcul8r_boot_reload_" + currentSha;
        fetch("/build-version.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (response) { return response.ok ? response.json() : null; })
          .then(function (next) {
            if (!next || !next.sha || next.sha === currentSha) return;
            if (sessionStorage.getItem(reloadKey) === next.sha) return;
            sessionStorage.setItem(reloadKey, next.sha);
            var url = new URL(window.location.href);
            url.searchParams.set("t", String(Date.now()));
            url.searchParams.set("build", next.sha);
            window.location.replace(url.toString());
          })
          .catch(function () { /* ignore offline/boot races */ });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
